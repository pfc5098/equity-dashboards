/* Instant tooltip: native SVG <title> is browser-throttled (slow to show / sometimes never).
   This shows the exact value the moment the cursor is over a bar, trend-line segment, or point. */
(function () {
  var tip = document.getElementById("chart-tip");
  var cur = null;
  function place(e) {
    var pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    var x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > window.innerWidth - 6) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 6) y = e.clientY - h - pad;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  document.addEventListener("pointermove", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!t) { if (cur) { tip.style.display = "none"; cur = null; } return; }
    if (t !== cur) { cur = t; tip.textContent = t.getAttribute("data-tip"); tip.style.display = "block"; }
    place(e);
  }, { passive: true });
  document.addEventListener("pointerleave", function () { tip.style.display = "none"; cur = null; }, true);
})();
</script>
</body>
</html>
